[project]
name = "eqmcontrol"
version = "0.1.0"
description = "Equilibrium Matching Controller"
readme = "readme.md"
authors = [{name = "Pau Carre Cardona", email = "pau.carre@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10,<3.11"
dependencies = [
    "aim>=3.29.1",
    "black>=25.1.0",
    "click>=8.1.8",
    "einops>=0.8.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.5",
    "notebook>=7.4.5",
    "opencv-python>=4.11.0.86",
    "pytest>=8.4.2",
    "pytorch-lightning>=2.5.3",
    "rerun-sdk==0.25.1",
    "ruff>=0.11.6",
    "scipy>=1.15.3",
    "snakeviz>=2.2.2",
    "tensorboard>=2.19.0",
    "torch>=2.3.1", # Relaxed to allow latest compatible version
    "uvicorn>=0.34.2",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

#[[tool.uv.index]]
#name = "pytorch"
#url = "https://download.pytorch.org/whl/cpu"
#explicit = true


[tool.black]
line-length = 88
target-version = ["py310"]  # Updated to match requires-python

[tool.ruff]
line-length = 88
target-version = "py310"  # Updated to match requires-python
